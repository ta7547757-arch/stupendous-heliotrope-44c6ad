<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders | Bintaah</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .orders-page {
            padding: 80px 7%;
            background: #faf8fb;
            min-height: 75vh;
        }

        .orders-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .orders-title p {
            color: #6b3b7d;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .orders-title h1 {
            color: #2d1935;
            font-size: 62px;
            margin: 0;
        }

        .orders-title h4 {
            display: block;
			font-size:24px;
            margin-top: 12px;
            color: #777;
        }

        #ordersContainer {
            max-width: 750px;
            margin: auto;
        }

        .order-card {
            background: #fff;
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 25px;
            box-shadow: 0 8px 30px rgba(75, 40, 93, 0.08);
            border: 1px solid #eee6f1;
        }

        .order-header {
		
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding-bottom: 18px;
            border-bottom: 1px solid #eee;
        }

        .order-id {
		margin:25px  auto 0;
            color: #2d1935;
            font-weight: 600;
            font-size: 17px;
        }

        .order-date {
            color: #888;
            font-size: 13px;
            margin-top: 5px;
        }

        .order-status {
            background: #f0e6f4;
            color: #6b3b7d;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .order-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 20px 0;
        }

        .order-info div {
            color: #555;
            font-size: 14px;
        }

        .order-info strong {
            color: #2d1935;
        }

        .order-products {
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .order-product {
            display: flex;
            align-items: start;
            gap: 35px;
            padding: 12px 0;
        }

        .order-product img {
            width: 270px;
            height: 450px;
            object-fit: cover;
            border-radius: 10px;
            background: #f5f1f6;
        }

        .order-product-info h3 {
            margin: 0 0 6px;
            color: #2d1935;
            font-size: 28px;
			margin-bottom:25px;
        }

        .order-product-info p {
            margin: 3px 0;
            color: #777;
            font-size: 20px;
			margin-bottom:25px;
        }

        .order-summary {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #eee;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            color: #666;
            font-size: 22px;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            color: #2d1935;
            font-size: 19px;
            font-weight: 700;
        }

        .empty-orders {
            text-align: center;
            background: #fff;
            padding: 60px 20px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(75, 40, 93, 0.07);
        }

        .empty-orders h2 {
            color: #2d1935;
            margin-bottom: 10px;
        }

        .empty-orders p {
            color: #777;
            margin-bottom: 25px;
        }

        .shop-btn {
            display: inline-block;
            background: #6b3b7d;
            color: #fff;
            padding: 13px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .shop-btn:hover {
            background: #4b285d;
            transform: translateY(-2px);
        }

        .login-message {
            text-align: center;
            background: #fff;
            padding: 60px 20px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(75, 40, 93, 0.07);
        }

        .login-message h2 {
            color: #2d1935;
            margin-bottom: 10px;
        }

        .login-message p {
            color: #777;
            margin-bottom: 25px;
        }
		
		
		

        @media (min-width: 381px) and (max-width: 767px) {

            .orders-page {
                padding: 50px 5%;
            }
			
           .orders-title p {
		   font-size:14px;
		  letter-spacing:1px;
		   
		   }
		   
		    .orders-title h4 {
			font-size:17px;
			}
			
			  
			 .order-card {
			 padding:15px;
			 }
			
			
            .orders-title h1 {
                font-size: 52px;
            }
.order-product img {
            width: 150px;
            height: 260px;
            object-fit: cover;
			}
            
 .order-product {
 gap:10px;
 }
            .order-info {
                grid-template-columns: 1fr;
            }
			  .order-product-info h3  {
			 font-size:20px;
			 }
			   .order-product-info p{ 
			  font-size: 18px;
			  }
			
			  .summary-row {
			  font-size:18px;
			  }
			   .order-id {
			 font-size:18px;
			 margin-bottom:15px;
			 }
			  .order-date {
            font-size: 17px;
			margin-bottom:10px;
        }
			 
			  .order-status {
			 font-size:18px;
			 }
			  .order-info div {
            font-size: 20px;
			
        }
		

        }
		
		
        @media (min-width: 768px) and (max-width: 1024px) {

            .orders-page {
                padding: 50px 4%;
            }
			
           .orders-title p {
		   font-size:16px;
		  letter-spacing:1.2px;
		   
		   }
		     
			 
		    .orders-title h4 {
			font-size:22px;
			}
			
            .orders-title h1 {
                font-size: 62px;
            }
			
			 .order-id {
			 font-size:22px;
			 }
			  .order-date {
            font-size: 20px;
			margin-bottom:20px;
        }
			 
			  .order-status {
			 font-size:22px;
			 }
			  .order-info div {
            font-size: 22px;
			margin-top:20px;
        }


			
.order-product img {
            width: 280px;
            height: 450px;
            object-fit: cover;
			}
            
 .order-product {
 gap:20px;
 }
			  .order-product-info h3  {
			 font-size:34px;
			 }
			   .order-product-info p { 
			  font-size: 24px;
			  }
			  
			
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            color: #666;
            font-size: 22px;
        }
			 
			  .summary-total {
			  font-size:22px;
			  }
			

        }


        @media (min-width: 320px) and (max-width: 380px) {

            .orders-page {
                padding: 50px 4%;
            }
			
           .orders-title p {
		   font-size:13px;
		  letter-spacing:1.2px;
		   
		   }
		   
		    .orders-title h4 {
			font-size:18px;
			}
			
            .orders-title h1 {
                font-size: 50px;
            }
			
			 .order-id {
			 font-size:18px;
			 margin-bottom:10px;
			 }
			  .order-date {
            font-size: 17px;
			margin-bottom:10px;
        }
			 
			  .order-status {
			 font-size:16px;
			 
			 }
			 
               .order-info {
                grid-template-columns: 1fr;
            } 
			
			  .order-info div {
            font-size: 18px;
			
        }

              
			 .order-card {
			 padding:10px;
			 }
			
.order-product img {
            width: 150px;
            height: 260px;
            object-fit: cover;
			}
            
 .order-product {
 gap:10px;
 }
			  .order-product-info h3  {
			 font-size:20px;
			 }
			   .order-product-info p { 
			  font-size: 17px;
			  }
			  
			
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            color: #666;
            font-size: 16px;
        }
			 
			  .summary-total {
			  font-size:17px;
			  }
			

        }

<body>

>

<!-- =========================
     MY ORDERS
========================= -->

<section class="orders-page">


    <div class="orders-title">

        <p>
            YOUR SHOPPING HISTORY
        </p>

        <h1>
            My Orders
        </h1>

        <h4>
            View your previous Bintaah orders.
        </h4>

    </div>


    <div id="ordersContainer">

        <p style="text-align:center;color:#777;">
            Loading your orders...
        </p>

    </div>


</section>



<!-- =========================
     SUPABASE
========================= -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL =
        "https://bxxkzthucjtltfwccpfs.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_v4Zf70CW1VN7kzCVhUGNtg_Pr1V8beF";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


/* =========================
   LOAD CUSTOMER ORDERS
========================= */

async function loadOrder() {

    const container =
        document.getElementById("ordersContainer");

    container.innerHTML = `
        <div class="empty-orders">
            <p>Loading your orders...</p>
        </div>
    `;


    /* GET TRACKING TOKEN */

    const urlParams =
        new URLSearchParams(window.location.search);

    const trackingToken =
        urlParams.get("token");


    /* =========================
       GET LOGGED IN USER
    ========================= */

    let currentUser = null;

    try {

        const {
            data: userData,
            error: authError
        } = await supabaseClient.auth.getUser();

        if (!authError && userData?.user) {
            currentUser = userData.user;
        }

    } catch (error) {

        console.log("User not logged in");

    }


    /* =========================
       GET ORDERS
    ========================= */

    let orders = [];


    /* TRACKING TOKEN */

    if (trackingToken) {

        const {
            data: order,
            error
        } = await supabaseClient
            .from("orders")
            .select("*")
            .eq("tracking_token", trackingToken)
            .maybeSingle();


        if (error) {

            console.error("Order Error:", error);

            container.innerHTML = `
                <div class="empty-orders">
                    <h2>Unable to Load Order</h2>
                    <p>Please try opening your order link again.</p>
                </div>
            `;

            return;

        }

        if (order) {
            orders = [order];
        }

    }


    /* =========================
       ACCOUNT ORDER HISTORY
    ========================= */

    else if (currentUser) {

        const {
            data,
            error
        } = await supabaseClient
            .from("orders")
            .select("*")
            .eq("user_id", currentUser.id)
            .order("created_at", {
                ascending: false
            });


        if (error) {

            console.error("Orders Error:", error);

            container.innerHTML = `
                <div class="empty-orders">
                    <h2>Unable to Load Orders</h2>
                    <p>Please try again later.</p>
                </div>
            `;

            return;

        }

        orders = data || [];

    }


    /* =========================
       NOT LOGGED IN
    ========================= */

    else {

        container.innerHTML = `
            <div class="empty-orders">
                <h2>Please Login</h2>
                <p>Login to your account to see your orders.</p>

                <a href="account.html" class="shop-btn">
                    LOGIN
                </a>
            </div>
        `;

        return;

    }


    /* =========================
       NO ORDERS
    ========================= */

    if (!orders || orders.length === 0) {

        container.innerHTML = `
            <div class="empty-orders">

                <h2>No Orders Yet</h2>

                <p>
                    You haven't placed any orders yet.
                </p>

                <a href="shop.html" class="shop-btn">
                    CONTINUE SHOPPING
                </a>

            </div>
        `;

        return;

    }


    /* =========================
       DISPLAY ALL ORDERS
    ========================= */

    let allOrdersHTML = "";


    orders.forEach(function(order) {


        /* PRODUCTS */

        let productsHTML = "";

        const products = order.products || [];


        products.forEach(function(product) {

            productsHTML += `

                <div class="order-product">

                    <img
                        src="${product.image}"
                        alt="${product.name}"
                    >

                    <div class="order-product-info">

                        <h3>
                            ${product.name}
                        </h3>

                        <p>
                            Size: ${product.size || "N/A"}
                        </p>

                        <p>
                            Quantity: ${product.quantity || 1}
                        </p>

                        <p>
                            Price: ৳ ${
                                product.price *
                                (product.quantity || 1)
                            }
                        </p>

                    </div>

                </div>

            `;

        });


        /* DELIVERY AREA */

        let areaText = order.delivery_area;

        if (order.delivery_area === "inside") {
            areaText = "Inside Dhaka";
        }

        if (order.delivery_area === "outside") {
            areaText = "Outside Dhaka";
        }


        /* DATE */

        const orderDate =
            order.created_at
                ? new Date(order.created_at).toLocaleString()
                : "N/A";


        /* ORDER CARD */

        allOrdersHTML += `

            <div class="order-card">

                <div class="order-header">

                    <div>

                        <div class="order-id">
                            Order ID: ${order.order_id}
                        </div>

                        <div class="order-date">
                            ${orderDate}
                        </div>

                    </div>

                    <div class="order-status">
                        ${order.status || "New"}
                    </div>

                </div>


                <div class="order-info">

                    <div>
                        <strong>Customer:</strong>
                        ${order.customer_name || "N/A"}
                    </div>

                    <div>
                        <strong>Phone:</strong>
                        ${order.phone || "N/A"}
                    </div>

                    <div>
                        <strong>Delivery:</strong>
                        ${areaText || "N/A"}
                    </div>

                    <div>
                        <strong>Payment:</strong>
                        ${order.payment_method || "Cash on Delivery"}
                    </div>

                    <div style="grid-column:1/-1;">

                        <strong>Address:</strong>
                        ${order.address || "N/A"}

                    </div>

                </div>


                <div class="order-products">
                    ${productsHTML}
                </div>


                <div class="order-summary">

                    <div class="summary-row">

                        <span>Subtotal</span>

                        <strong>
                            ৳ ${order.subtotal || 0}
                        </strong>

                    </div>


                    <div class="summary-row">

                        <span>Delivery</span>

                        <strong>
                            ৳ ${order.delivery_charge || 0}
                        </strong>

                    </div>


                    <div class="summary-total">

                        <span>Total</span>

                        <strong>
                            ৳ ${order.total || 0}
                        </strong>

                    </div>

                </div>

            </div>

        `;

    });


    /* SHOW ORDERS */

    container.innerHTML = allOrdersHTML;

}


/* START */

loadOrder();

</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const menuButton = document.querySelector(".mobile-menu-btn");
    const menu = document.querySelector(".header .menu");

    menuButton.addEventListener("click", function () {
        menu.classList.toggle("active");
    });

});
</script>


</body>
