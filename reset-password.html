
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Bintaah</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(circle at top left, #f3e7ff, transparent 50%),
                #f8f2f8;
            font-family: Arial, sans-serif;
        }

        .reset-container {
            width: 100%;
            max-width: 460px;
            padding: 45px 35px;
            background: #ffffff;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(75, 40, 93, 0.12);
            text-align: center;
        }

        .reset-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f1e5fa;
            color: #6b3b7d;
            font-size: 30px;
        }

        .reset-container h1 {
            font-family: Georgia, serif;
            font-size: 30px;
            color: #4b285d;
            margin-bottom: 12px;
        }

        .reset-description {
            color: #777;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .reset-form {
            text-align: left;
        }

        .reset-form label {
            display: block;
            margin: 17px 0 8px;
            color: #4b285d;
            font-size: 14px;
            font-weight: 600;
        }

        .reset-form input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dfcce9;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            background: #fdfbff;
        }

        .reset-form input:focus {
            border-color: #8b5aa0;
            box-shadow: 0 0 0 3px rgba(194, 162, 242, 0.18);
        }

        .reset-button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 30px;
            background: #6b3b7d;
            color: white;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .reset-button:hover {
            background: #4b285d;
            transform: translateY(-2px);
        }

        .reset-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #resetMessage {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #6b3b7d;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .reset-container {
                padding: 35px 23px;
            }

            .reset-container h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="reset-container">

    <div class="reset-icon">🔐</div>

    <h1>Reset Password</h1>

    <p class="reset-description">
        Create a new password for your Bintaah account.
        Choose a secure password you haven't used before.
    </p>

    <form class="reset-form" id="resetForm">

        <label for="newPassword">New Password</label>

        <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            required
            minlength="6"
        >

        <label for="confirmPassword">Confirm New Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            required
            minlength="6"
        >

        <button
            type="submit"
            class="reset-button"
            id="resetButton">

            UPDATE PASSWORD

        </button>

    </form>

    <p id="resetMessage"></p>

    <a href="account.html" class="back-link">
        ← Back to My Account
    </a>

</div>


<script>

const SUPABASE_URL =
    "https://bxxkzthucjtltfwccpfs.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_v4Zf70CW1VN7kzCVhUGNtg_Pr1V8beF";

const { createClient } = window.supabase;

const supabaseClient = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// =============================
// RESET PASSWORD
// =============================

document.getElementById("resetForm")
.addEventListener("submit", async function (e) {

    e.preventDefault();

    const password =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("resetMessage");

    const button =
        document.getElementById("resetButton");


    message.style.color = "#b04455";


    // PASSWORD CHECK

    if (password.length < 6) {

        message.textContent =
            "Password must be at least 6 characters.";

        return;
    }


    // CONFIRM PASSWORD

    if (password !== confirmPassword) {

        message.textContent =
            "Passwords do not match.";

        return;
    }


    button.disabled = true;

    button.textContent = "UPDATING...";


    // UPDATE PASSWORD IN SUPABASE

    const { data, error } =
        await supabaseClient.auth.updateUser({
            password: password
        });


    if (error) {

        message.style.color = "#b04455";

        message.textContent =
            error.message;

        button.disabled = false;

        button.textContent = "UPDATE PASSWORD";

        return;
    }


    // SUCCESS

    message.style.color = "#49845a";

    message.textContent =
        "Password updated successfully! You can now login with your new password.";

    document.getElementById("resetForm").reset();

    button.textContent = "PASSWORD UPDATED";

});

</script>

</body>
</html>
